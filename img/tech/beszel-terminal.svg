<svg width="820" height="340" viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', monospace">
  <!-- Terminal window frame -->
  <rect width="820" height="340" rx="10" fill="#1e1e2e"/>
  <rect width="820" height="340" rx="10" fill="none" stroke="#313244" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect width="820" height="36" rx="10" fill="#181825"/>
  <rect y="26" width="820" height="10" fill="#181825"/>
  <circle cx="22" cy="18" r="6" fill="#f38ba8"/>
  <circle cx="42" cy="18" r="6" fill="#fab387"/>
  <circle cx="62" cy="18" r="6" fill="#a6e3a1"/>
  <text x="410" y="23" text-anchor="middle" fill="#6c7086" font-size="12">ansible-playbook nodes/myrtle.yml</text>

  <!-- Terminal content -->
  <!-- prompt line -->
  <text x="20" y="68" fill="#cdd6f4" font-size="13">
    <tspan fill="#89b4fa">❯ </tspan>
    <tspan fill="#cdd6f4">ansible-playbook nodes/myrtle.yml</tspan>
  </text>

  <text x="20" y="90"  fill="#6c7086" font-size="13">PLAY [myrtle] ******************************************************************************</text>
  <text x="20" y="110" fill="#6c7086" font-size="13">TASK [Gathering Facts] **********************************************************************</text>
  <text x="20" y="128" fill="#a6e3a1" font-size="13"><tspan fill="#a6e3a1">ok: </tspan><tspan fill="#89dceb">[myrtle]</tspan></text>

  <text x="20" y="148" fill="#6c7086" font-size="13">TASK [Create beszel hub data directory] *****************************************************</text>
  <text x="20" y="166" fill="#a6e3a1" font-size="13"><tspan fill="#a6e3a1">ok: </tspan><tspan fill="#89dceb">[myrtle]</tspan></text>

  <text x="20" y="186" fill="#6c7086" font-size="13">TASK [Deploy beszel hub docker-compose.yml] *************************************************</text>
  <text x="20" y="204" fill="#fab387" font-size="13"><tspan fill="#fab387">changed: </tspan><tspan fill="#89dceb">[myrtle]</tspan></text>

  <text x="20" y="224" fill="#6c7086" font-size="13">TASK [Start beszel hub] *********************************************************************</text>
  <text x="20" y="242" fill="#fab387" font-size="13"><tspan fill="#fab387">changed: </tspan><tspan fill="#89dceb">[myrtle]</tspan><tspan fill="#6c7086">  => Started beszel</tspan></text>

  <!-- Divider -->
  <line x1="20" y1="258" x2="800" y2="258" stroke="#313244" stroke-width="1"/>

  <!-- Play recap -->
  <text x="20" y="275" fill="#6c7086" font-size="13">PLAY RECAP **********************************************************************************</text>
  <text x="20" y="294" fill="#cdd6f4" font-size="13">
    <tspan fill="#89dceb">myrtle</tspan>
    <tspan fill="#6c7086">   : </tspan>
    <tspan fill="#a6e3a1">ok=4</tspan>
    <tspan fill="#6c7086">   </tspan>
    <tspan fill="#fab387">changed=2</tspan>
    <tspan fill="#6c7086">   unreachable=0   failed=0</tspan>
  </text>

  <!-- Time badge -->
  <rect x="624" y="280" width="174" height="24" rx="4" fill="#1e3a2e" stroke="#a6e3a1" stroke-width="1"/>
  <text x="711" y="296" text-anchor="middle" fill="#a6e3a1" font-size="12">hub up in 00:00:04</text>

  <!-- Blinking cursor -->
  <rect x="20" y="315" width="8" height="14" rx="1" fill="#cdd6f4" opacity="0.7"/>
</svg>
