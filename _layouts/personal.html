<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — {{ site.title }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.7;
      background-color: #1e1e1e;
      color: #d0cfc9;
      margin: 0;
      padding: 20px;
    }

    .wrapper {
      max-width: 760px;
      margin: 0 auto;
      background-color: #272727;
      padding: 48px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    header {
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid #3a3a3a;
    }

    header a {
      color: #a0b8c8;
      text-decoration: none;
      font-size: 0.9em;
    }
    header a:hover { text-decoration: underline; }

    h1, h2, h3, h4 {
      color: #e8e0d0;
      line-height: 1.3;
    }

    h1 { font-size: 1.9em; margin-bottom: 8px; }

    .post-meta {
      color: #888;
      font-size: 0.85em;
      margin-bottom: 32px;
    }

    a { color: #7eb8d4; }
    a:hover { color: #a8d4e8; }

    img {
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
      margin: 24px 0;
    }

    code {
      background: #1a1a1a;
      color: #c0d8b0;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.9em;
    }

    pre {
      background: #1a1a1a;
      color: #c0d8b0;
      padding: 20px;
      border-radius: 6px;
      overflow-x: auto;
    }
    pre code { background: none; padding: 0; }

    blockquote {
      border-left: 3px solid #4a4a4a;
      margin-left: 0;
      padding-left: 20px;
      color: #a0a0a0;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin: 20px 0;
    }
    th {
      background: #1a1a1a;
      color: #c0c0c0;
      padding: 10px 14px;
      text-align: left;
    }
    td {
      padding: 8px 14px;
      border-bottom: 1px solid #363636;
    }
    tr:last-child td { border-bottom: none; }

    hr {
      border: none;
      border-top: 1px solid #3a3a3a;
      margin: 32px 0;
    }

    footer {
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid #3a3a3a;
      font-size: 0.8em;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <a href="/blog-personal.html">← personal</a>
    </header>
    <h1>{{ page.title }}</h1>
    <div class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</div>
    {{ content }}
    <footer>{{ site.title }}</footer>
  </div>
</body>
</html>
