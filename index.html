<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Image Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        img {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background-color: #000;
        }
    </style>
</head>
<body>
    <img id="randomImage" alt="Random Image">
    
    <script>
        // List your images here
        const images = [
            'img/books.avif',
            'img/buzz2001.gif',
            'img/cajuntots.jpg',
            'img/drgirlfriend.gif',
            'img/fightclub.gif',
            'img/pink-floyd.gif',
            'img/red5.avif',
            'img/spock_cat.gif',
            'img/swag.gif',
            'img/totoro.gif',
            'img/tron-cinemagraph.gifv',
            'img/tucson_sunset.gif'
            // Add more image paths as needed
        ];
        
        // Get a random image
        const randomIndex = Math.floor(Math.random() * images.length);
        const randomImage = images[randomIndex];
        
        // Display the image
        document.getElementById('randomImage').src = randomImage;
    </script>
</body>
</html>
