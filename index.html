<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Image Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        img {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background-color: #000;
        }
    </style>
</head>
<body>
    <img id="randomImage" alt="Random Image">
    
    <script>
        // List your images here
        const images = [
            'img/cg/books.avif',
            'img/cg/buzz2001.gif',
            'img/cg/cajuntots.jpg',
            'img/cg/drgirlfriend.gif',
            'img/cg/fightclub.gif',
            'img/cg/pink-floyd.gif',
            'img/cg/red5.avif',
            'img/cg/spock_cat.gif',
            'img/cg/swag.gif',
            'img/cg/totoro.gif',
            'img/cg/tron-cinemagraph.gifv',
            'img/cg/tucson_sunset.gif'
            // Add more image paths as needed
        ];
        
        // Get a random image
        const randomIndex = Math.floor(Math.random() * images.length);
        const randomImage = images[randomIndex];
        
        // Display the image
        document.getElementById('randomImage').src = randomImage;
        
        // Navigate to index2.html on any click
        document.body.addEventListener('click', function() {
            window.location.href = 'index2.html';
        });
    </script>
</body>
</html>
