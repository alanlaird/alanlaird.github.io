---
layout: home
title: Personal
---
<link rel="stylesheet" href="/style.css">

<div class="content-container">
  <h1>personal</h1>
  <ul>
    {% for post in site.categories.personal %}
    <li>
      <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
      <a href="{{ post.url }}">{{ post.title }}</a>
    </li>
    {% endfor %}
  </ul>
</div>

<style>
  body { background-color: #1e1e1e; color: #d0cfc9; }
  .content-container {
    background-color: #272727;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .content-container h1 { color: #e8e0d0; }
  .content-container ul { list-style: none; padding: 0; flex: 1; }
  .content-container li { padding: 8px 0; border-bottom: 1px solid #3a3a3a; }
  .content-container li:last-child { border-bottom: none; }
  .post-date { color: #666; font-size: 0.85em; margin-right: 12px; }
  .content-container a { color: #7eb8d4; text-decoration: none; }
  .content-container a:hover { color: #a8d4e8; text-decoration: underline; }
</style>
