<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · Lost in space</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02030a; color: #e8ecff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { position: fixed; inset: 0; display: block; }
  .hud { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; padding: 16px; }
  h1 { font-size: clamp(72px, 20vw, 180px); margin: 0; font-weight: 800; letter-spacing: -4px;
       background: linear-gradient(180deg, #fff, #8aa0ff 60%, #3b2a7a); -webkit-background-clip: text; background-clip: text; color: transparent;
       filter: drop-shadow(0 0 30px rgba(120,140,255,.35)); }
  p { margin: 8px 0 0; color: #aab4e8; font-size: 17px; }
  code { color: #ffd27a; word-break: break-all; }
  a { pointer-events: auto; display: inline-block; margin-top: 22px; color: #02030a; background: #ffd27a; padding: 10px 18px; border-radius: 999px; text-decoration: none; font-weight: 600; }
  a:hover { background: #fff; }
  .hint { position: fixed; bottom: 14px; width: 100%; text-align: center; font-size: 12px; color: #5b648f; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div>
    <h1>404</h1>
    <p>Houston, we can't find <code id="path"></code>.</p>
    <p>It drifted out past the heliopause.</p>
    <a href="/">Return to base</a>
  </div>
</div>
<div class="hint">move your mouse to steer · click to warp</div>
<script>
(function () {
  var path = location.pathname.indexOf('/404s/') === 0 ? '/the/page/you/wanted' : location.pathname;
  document.getElementById('path').textContent = path;
  var c = document.getElementById('c'), x = c.getContext('2d'), W, H, stars = [], N = 700;
  var speed = 2, target = 2, cx = 0, cy = 0, mx = 0, my = 0;
  function size() { W = c.width = innerWidth; H = c.height = innerHeight; }
  size(); addEventListener('resize', size);
  function star() { return { x: (Math.random() - .5) * 2000, y: (Math.random() - .5) * 2000, z: Math.random() * 1000 + 1 }; }
  for (var i = 0; i < N; i++) stars.push(star());
  addEventListener('mousemove', function (e) { mx = (e.clientX / W - .5) * 400; my = (e.clientY / H - .5) * 400; });
  addEventListener('click', function () { target = 40; setTimeout(function () { target = 2; }, 900); });
  // a lonely little floating page
  var page = { x: 0, y: 0, z: 900, r: 0 };
  function frame() {
    speed += (target - speed) * .06; cx += (mx - cx) * .03; cy += (my - cy) * .03;
    x.fillStyle = speed > 6 ? 'rgba(2,3,10,.25)' : '#02030a'; x.fillRect(0, 0, W, H);
    for (var i = 0; i < N; i++) {
      var s = stars[i], pz = s.z; s.z -= speed;
      if (s.z < 1) { stars[i] = star(); stars[i].z = 1000; continue; }
      var k = 300 / s.z, sx = (s.x - cx) * k + W / 2, sy = (s.y - cy) * k + H / 2;
      var k2 = 300 / pz, px = (s.x - cx) * k2 + W / 2, py = (s.y - cy) * k2 + H / 2;
      var b = 1 - s.z / 1000;
      x.strokeStyle = 'rgba(' + (200 + 55 * b | 0) + ',' + (210 + 45 * b | 0) + ',255,' + b + ')';
      x.lineWidth = b * 2.2; x.beginPath(); x.moveTo(px, py); x.lineTo(sx, sy); x.stroke();
    }
    // drifting page, tumbling away
    page.z += .6; page.r += .01; if (page.z > 2600) page.z = 300;
    var pk = 300 / page.z, ppx = (900 - cx) * pk + W / 2, ppy = (-520 - cy) * pk + H / 2, sz = 90 * pk;
    x.save(); x.translate(ppx, ppy); x.rotate(page.r); x.globalAlpha = Math.max(0, 1 - page.z / 2600);
    x.fillStyle = '#f5f7ff'; x.fillRect(-sz / 2, -sz * .65, sz, sz * 1.3);
    x.fillStyle = '#9aa6d6'; for (var l = 0; l < 6; l++) x.fillRect(-sz * .38, -sz * .5 + l * sz * .18, sz * (l === 5 ? .4 : .76), sz * .06);
    x.restore();
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
