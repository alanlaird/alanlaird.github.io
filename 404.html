<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · Page Not Found</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ccc; font: 16px/1.5 system-ui, sans-serif; }
  .fallback { display: grid; place-items: center; height: 100%; text-align: center; }
  a { color: #8cf; }
</style>
</head>
<body>
<div class="fallback">
  <div>
    <h1>404</h1>
    <p>Nothing lives here. <a href="/">Go home</a>.</p>
  </div>
</div>
<script>
// Pick a random 404 from /404s/ and swap it in, so the broken URL stays in the address bar.
// Force a specific one with ?404=name, e.g. /nope?404=breakout. Gallery: /404s/
(function () {
  var pages = ['neon', 'terminal', 'nvidia-smi', 'setlist', 'space', 'breakout'];
  var forced = new URLSearchParams(location.search).get('404');
  var pick = pages.indexOf(forced) >= 0 ? forced : pages[Math.floor(Math.random() * pages.length)];
  fetch('/404s/' + pick + '.html')
    .then(function (r) { if (!r.ok) throw r.status; return r.text(); })
    .then(function (html) { document.open(); document.write(html); document.close(); })
    .catch(function () { /* keep the plain fallback */ });
})();
</script>
</body>
</html>
